[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hormone-from-physiology"
version = "0.1.0"
description = "Open research stack: infer menstrual hormonal state from wearable physiology on mcPHASES"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Skyler Kaufman" }]
keywords = [
  "menstrual-cycle",
  "wearables",
  "hormones",
  "mcphases",
  "machine-learning",
  "womens-health",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "joblib>=1.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
dev = [
  "pytest>=7.4",
  "ruff>=0.4",
  "hormone-from-physiology[viz]",
]

[project.urls]
Homepage = "https://github.com/skykauf/hormone-from-physiology"
Repository = "https://github.com/skykauf/hormone-from-physiology"
Issues = "https://github.com/skykauf/hormone-from-physiology/issues"
Dataset = "https://physionet.org/content/mcphases/1.0.0/"

[project.scripts]
hfp-train-phase = "hfp.cli:train_phase_main"
hfp-eval = "hfp.cli:eval_main"

[tool.hatch.build.targets.wheel]
only-include = ["hfp"]

[tool.hatch.build.targets.sdist]
include = ["src/hfp", "tests", "docs", "scripts", "README.md", "LICENSE", "pyproject.toml", "CONTRIBUTING.md", "data/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
